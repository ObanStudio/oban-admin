name: Build Admin APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
    
    - name: Safe Setup
      run: |
        flutter create --overwrite --org com.obanstudio .
        
        # Точечно меняем версию Kotlin
        sed -i 's/id "org.jetbrains.kotlin.android" version ".*" apply false/id "org.jetbrains.kotlin.android" version "1.9.24" apply false/' android/settings.gradle
        
        # Добавляем Google Services
        sed -i '/id "org.jetbrains.kotlin.android"/a \    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle
        sed -i '/id "com.android.application"/a \    id "com.google.gms.google-services"' android/app/build.gradle
        
        # Гарантируем, что Gradle видит правильное имя пакета
        sed -i 's/applicationId = ".*"/applicationId = "com.obanstudio.admin"/' android/app/build.gradle
        sed -i 's/namespace = ".*"/namespace = "com.obanstudio.admin"/' android/app/build.gradle

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons
      
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: oban-admin-apk
        path: build/app/outputs/flutter-apk/app-release.apk
